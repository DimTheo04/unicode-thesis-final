services:
  postgres:
    image: postgres:16-alpine
    container_name: codereview_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codereview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codereview_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codereview_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codereview_db?schema=public
      JWT_SECRET: super-secure-production-jwt-secret-key-32chars
      CLIENT_ORIGIN: http://localhost
    volumes:
      - uploads_data:/app/uploads
    networks:
      - codereview_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codereview_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - codereview_network

volumes:
  postgres_data:
  uploads_data:

networks:
  codereview_network:
    driver: bridge
